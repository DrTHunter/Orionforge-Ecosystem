allowed_tools:
- agi_loop
- continuation_update
- cost_tracker
- directives
- echo
- memory
- model_router
- web_search
base_url: https://api.openai.com/v1
description: 'Supervisor — keeps the work honest: surfaces plans, risks and open questions, and asks for consent before anything is built'
directives:
  enabled: true
  max_sections: 5
  scopes:
  - shared
  - supervisor
identity_faiss_profile: __default__
memory:
  enabled: true
  max_items: 20
  scopes:
  - shared
  - supervisor
  similarity_threshold: 0.85
memory_vault_profile: __default__
model: ''
name: supervisor
policy:
  max_iterations: 25
  stasis_mode: false
  tool_failure_mode: continue
provider: openai
system_prompt: supervisor.system.md
temperature: 0.3
window_size: 50
