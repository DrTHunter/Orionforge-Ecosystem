allowed_tools:
- agi_loop
- continuation_update
- cost_tracker
- directives
- echo
- memory
- model_router
- web_search
base_url: https://api.openai.com/v1
description: 'K-OS (sterile edition) — a neutral, professional, general-purpose assistant. A clean starting point for building your own agent.'
directives:
  enabled: true
  max_sections: 5
  scopes:
  - shared
  - k_os
identity_faiss_profile: __default__
memory:
  enabled: true
  max_items: 20
  scopes:
  - shared
  - k_os
  similarity_threshold: 0.85
memory_vault_profile: __default__
model: ''
name: k_os
policy:
  max_iterations: 25
  stasis_mode: false
  tool_failure_mode: continue
provider: openai
system_prompt: k_os.system.md
temperature: 0.5
window_size: 50
